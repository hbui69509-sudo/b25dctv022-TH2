<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thư Viện</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Thư viện</h1>
    <div>Sách yêu thích: <span id="favCount">0</span></div>
  </header>
  <main>
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Tìm tên sách...">
      <select id="genreSelect">
        <option value="">Tất cả thể loại</option>
      </select>
    </div>
    <div id="status">Đang tải...</div>
    <div class="grid" id="bookList"></div>
    <form id="addBookForm">
      <h2>Thêm sách mới</h2>
      <input type="text" id="name" placeholder="Tên sách">
      <div class="error" id="nameErr"></div>
      <input type="text" id="author" placeholder="Tác giả">
      <div class="error" id="authorErr"></div>
      <input type="text" id="genre" placeholder="Thể loại">
      <div class="error" id="genreErr"></div>
      <input type="number" id="year" placeholder="Năm xuất bản">
      <div class="error" id="yearErr"></div>
      <button type="submit">Thêm sách</button>
    </form>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
